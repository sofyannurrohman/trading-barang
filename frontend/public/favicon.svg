<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1010" />
      <stop offset="50%" stop-color="#7B1D1D" />
      <stop offset="100%" stop-color="#9B2C2C" />
    </linearGradient>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB2B2" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>
    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#E53E3E" />
    </linearGradient>
    <linearGradient id="boxRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E53E3E" />
      <stop offset="100%" stop-color="#9B2C2C" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background Container -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="rgba(254, 205, 211, 0.3)" stroke-width="1" />

  <!-- 3D Isometric Trading / Inventory Box -->
  <g transform="translate(24, 24) scale(0.9)">
    <!-- Top Face -->
    <polygon points="0,-15 15,-6 0,3 -15,-6" fill="url(#boxTop)" />
    <!-- Left Face -->
    <polygon points="-15,-6 0,3 0,17 -15,8" fill="url(#boxLeft)" />
    <!-- Right Face -->
    <polygon points="0,3 15,-6 15,8 0,17" fill="url(#boxRight)" />
    
    <!-- ERP Growth / Trade Dynamic Arrow -->
    <path d="M-6,2 L0,-2 L6,2 L0,6 Z" fill="#FFFFFF" opacity="0.4" />
    <path d="M-9, -1 M0, -8 M9, -1" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>