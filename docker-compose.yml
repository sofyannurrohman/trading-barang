# =============================================================
# SETUP: Buat file .env dari .env.example sebelum menjalankan:
#   cp .env.example .env
# Lalu isi nilai yang sesuai di file .env tersebut.
# =============================================================

services:
  db:
    image: postgres:16
    container_name: erp_pkp_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp_pkp_backend
    ports:
      - "127.0.0.1:8083:8080"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: erp_pkp_frontend
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads_data:
